<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Scheduler</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --fg:#1d1d1b; --mut:#6b6b66; --line:#dcdcd6; --acc:#2d6cdf; --ok:#1f8a4c; --warn:#b26a00; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#201f1e; --fg:#ecebe6; --mut:#9a9992; --line:#35342f; --acc:#6b9bff; --ok:#4cc27f; --warn:#e0a43c; --bad:#ef7566; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,sans-serif; padding:16px; }
  main { max-width:760px; margin:0 auto; display:grid; gap:14px; }
  h1 { font-size:20px; margin:0; } h2 { font-size:15px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  label { display:grid; gap:4px; font-size:12px; color:var(--mut); flex:1 1 150px; }
  input, select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input:disabled { opacity:.45; }
  button { cursor:pointer; background:var(--acc); color:#fff; border-color:transparent; }
  button.ghost { background:transparent; color:var(--fg); border-color:var(--line); }
  button.danger { background:var(--bad); color:#fff; border-color:transparent; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .badges { display:flex; gap:8px; flex-wrap:wrap; }
  .badge { font-size:12px; padding:3px 9px; border-radius:99px; border:1px solid var(--line); color:var(--mut); }
  .badge.on { color:var(--ok); border-color:var(--ok); } .badge.off { color:var(--bad); border-color:var(--bad); }
  .nowline { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline;
             padding:8px 10px; margin-bottom:8px; border-radius:8px; background:var(--bg); border:1px solid var(--line); }
  .nowline .main { font-weight:600; }
  .nowline .main.playing { color:var(--bad); }
  .nowline .meta { font-size:12px; color:var(--mut); }
  .sub { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); margin:12px 0 2px; }
  .sub:first-child { margin-top:0; }
  .item { display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:10px 0; border-top:1px solid var(--line); }
  .sub + .item { border-top:0; }
  .when { font-weight:600; } .what { color:var(--mut); font-size:13px; }
  .chip { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; }
  .chip.sched { color:var(--acc); } .chip.done { color:var(--ok); } .chip.late { color:var(--warn); } .chip.bad { color:var(--bad); }
  .chip.now { color:var(--bad); animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .chip.now { animation:none; } }
  .empty { color:var(--mut); padding:6px 0; }
  .hint { font-size:12px; color:var(--mut); margin-top:8px; }
  details summary { cursor:pointer; color:var(--mut); }
  #vol-out { font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Sound Scheduler</h1>
    <div class="badges">
      <span id="b-conn" class="badge off">broker: disconnected</span>
      <span id="b-dev" class="badge">device: unknown</span>
    </div>
  </div>

  <details class="card" id="conn-card" open>
    <summary>Connection (saved in this browser only)</summary>
    <div class="row" style="margin-top:10px">
      <label>EMQX host<input id="c-host" placeholder="n16a90c6.ala.us-east-1.emqxsl.com"></label>
      <label>Username<input id="c-user" autocomplete="username"></label>
      <label>Password<input id="c-pass" type="password" autocomplete="current-password"></label>
      <button id="c-go">Connect</button>
    </div>
  </details>

  <section class="card">
    <h2>New request</h2>
    <div class="row">
      <label>Mode
        <select id="f-mode">
          <option value="sched">Schedule at a time</option>
          <option value="queue">Queue (play in order)</option>
        </select>
      </label>
      <label>Function
        <select id="f-fn">
          <option value="track">Play sound</option>
          <option value="folder">Play folder (series)</option>
        </select>
      </label>
      <label>Sound / folder number
        <input id="f-target" type="number" min="0" step="1" placeholder="Enter number">
      </label>
    </div>
    <div class="row" style="margin-top:10px">
      <label>Volume: <span id="vol-out">20</span> / 30
        <input id="f-vol" type="range" min="1" max="30" value="20">
      </label>
      <label>Schedule time<input id="f-at" type="datetime-local"></label>
      <button id="f-now" class="ghost" type="button">Now</button>
      <button id="f-add" disabled>Add to schedule</button>
      <button id="f-addnow" disabled title="Schedule for right now - plays before anything queued">Play now (priority)</button>
    </div>
    <div class="hint" id="f-hint"></div>
  </section>

  <section class="card">
    <div class="top" style="margin-bottom:8px">
      <h2 style="margin:0">Queue</h2>
      <div class="row" style="align-items:center">
        <button id="q-stop" class="danger" disabled title="Stop whatever is playing right now">Stop now</button>
        <button id="q-clear" class="ghost">Remove finished</button>
        <button id="q-all" class="ghost" disabled title="Remove every item">Clear queue</button>
      </div>
    </div>
    <div class="nowline" id="now-line" hidden>
      <span class="main" id="now-main"></span>
      <span class="meta" id="now-meta"></span>
    </div>
    <div id="q-list"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
// ============ EDIT THESE: what's on the SD card ============
// Single sounds live in /MP3/0001.mp3, 0002.mp3 ...  -> n is the file number
const TRACKS  = [ {n:1,name:"Sound 1"}, {n:2,name:"Sound 2"}, {n:3,name:"Sound 3"} ];
// Folders live in /01, /02 ... and play every file inside in order -> n is the folder number
const FOLDERS = [ {n:1,name:"Series 1"}, {n:2,name:"Series 2"} ];
// ===========================================================

const T_SCHED = "prank/schedule";   // website -> device (retained list; also non-retained commands)
const T_STATE = "prank/state";      // device -> website (retained)

// Result codes sent by the ESP32 for each item
const R_PLAYING = 0, R_DONE = 1, R_FAIL = 2, R_STOP = 3, R_SKIP = 4;

let client = null, items = [], done = {}, loaded = false;
let dev = { online:null, now:0, status:"", current:"", fn:"track", target:-1, lastReboot:"" };
const $ = id => document.getElementById(id);

// ---------- connection ----------
function load(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }
function save(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

function connect() {
  const host = $("c-host").value.trim(), user = $("c-user").value.trim(), pass = $("c-pass").value.trim();
  if (!host || !user) return;
  save("host", host); save("user", user); save("pass", pass);
  if (client) client.end(true);
  loaded = false; setConn("connecting…", false);

  let lastErr = "";
  client = mqtt.connect("wss://" + host + ":8084/mqtt", {
    username: user, password: pass, clientId: "web-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000, connectTimeout: 8000, clean: true
  });

  client.on("connect", () => {
    lastErr = "";
    setConn("broker: connected", true);
    client.subscribe([T_SCHED, T_STATE], { qos: 1 });
    setTimeout(() => { loaded = true; render(); }, 2500);   // no retained list yet = empty
  });

  client.on("close", () => {
    if (!lastErr) setConn("broker: disconnected", false);   // don't overwrite a real error message
    render();
  });

  client.on("error", e => {
    lastErr = e.message || String(e);
    setConn("error: " + lastErr, false);
    // bad credentials / not authorized: stop retrying so the message stays visible
    if (e.code === 4 || e.code === 5 || /refused|authorized/i.test(lastErr)) client.end(true);
  });

  client.on("message", (topic, buf) => {
    let d; try { d = JSON.parse(buf.toString()); } catch (e) { return; }
    if (topic === T_SCHED && Array.isArray(d.items)) { items = d.items; loaded = true; }
    if (topic === T_STATE) {
      if (d.online) {
        dev = { online: true, now: d.now || 0, status: d.status || "", current: d.current || "",
                fn: d.fn || "track", target: (d.target ?? -1), lastReboot: d.lastReboot || "" };
        done = {};
        (d.done || []).forEach(x => { done[x.id] = { t: x.t, f: x.f || x.t, r: (x.r ?? R_DONE) }; });
      } else {
        // Offline message from the broker: keep the last known results, just mark the device offline
        dev = { ...dev, online: false, status: "offline", current: "" };
      }
    }
    render();
  });
}
function setConn(t, ok){ const b = $("b-conn"); b.textContent = t; b.className = "badge " + (ok ? "on" : "off"); }

function publish() {
  if (!client || !client.connected) return;
  client.publish(T_SCHED, JSON.stringify({ v:1, items }), { qos:1, retain:true });
}

// ---------- stop / clear ----------
function sendStop() {
  if (!client || !client.connected) return;
  // Not retained: stops the current sound without replacing the stored list
  client.publish(T_SCHED, JSON.stringify({ cmd:"stop" }), { qos:1, retain:false });
}
function clearQueue() {
  if (!items.length) return;
  if (!confirm("Remove every scheduled and queued item?")) return;
  items = [];
  publish();
  render();
}

// ---------- form ----------
function toLocalInput(d) {
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}
function setNow(offsetMin){ $("f-at").value = toLocalInput(new Date(Date.now() + offsetMin*60000)); }

function updateMode() {
  const queue = $("f-mode").value === "queue";
  $("f-at").disabled  = queue;
  $("f-now").disabled = queue;
  $("f-add").textContent = queue ? "Add to queue" : "Add to schedule";
  $("f-hint").textContent = queue
    ? "Queued items play one after another, in the order added, whenever no scheduled item is due."
    : "Scheduled items play at their time, ahead of anything queued.";
}

// atOverride: a Unix time in seconds ("Play now"); otherwise the mode decides
function addItem(atOverride) {
  const queued = !atOverride && $("f-mode").value === "queue";
  const at = atOverride
    || (queued ? Math.floor(Date.now() / 1000)                              // queue: time added (sets the order)
               : Math.floor(new Date($("f-at").value).getTime() / 1000));   // schedule: chosen time
  const target = Number($("f-target").value);
  const vol = Number($("f-vol").value);

  if (!at || !Number.isInteger(target) || target < 0) {
    alert("Please enter a valid sound or folder number.");
    return;
  }

  const it = { id: Math.random().toString(36).slice(2,8), fn: $("f-fn").value, target, vol, at };
  if (queued) it.q = 1;
  items.push(it);

  publish();
  render();
}

// ---------- status helpers ----------
function nameOf(it) {
  const list = it.fn === "track" ? TRACKS : FOLDERS;
  const hit = list.find(x => x.n === it.target);
  return (it.fn === "track" ? "Sound: " : "Folder: ") + (hit ? hit.name : "#" + it.target);
}
function isPlaying(it) { return dev.online && dev.status === "playing" && dev.current === it.id; }
function timeText(s) { return new Date(s * 1000).toLocaleTimeString(); }

// Returns [chipClass, chipText] for an item that has started, or null if it hasn't
function resultChip(it) {
  if (isPlaying(it)) return ["now", "▶ playing"];
  const d = done[it.id];
  if (!d) return null;
  switch (d.r) {
    case R_PLAYING: return ["sched", "started " + timeText(d.t)];
    case R_FAIL:    return ["bad",   "✕ failed " + timeText(d.f)];
    case R_STOP:    return ["late",  "■ stopped " + timeText(d.f)];
    case R_SKIP:    return ["late",  "skipped (too late)"];
    default:        return ["done",  "✓ done " + timeText(d.f)];
  }
}

function renderNowLine() {
  const box = $("now-line"), main = $("now-main"), meta = $("now-meta");
  if (dev.online === null) { box.hidden = true; return; }
  box.hidden = false;
  main.className = "main";
  if (!dev.online) {
    main.textContent = "Device offline";
  } else if (dev.status === "playing") {
    const it = items.find(x => x.id === dev.current);
    main.textContent = "▶ Now playing: " + (it ? nameOf(it) : nameOf({ fn:dev.fn, target:dev.target }));
    main.className = "main playing";
  } else if (dev.status === "rebooting") {
    main.textContent = "Device restarting…";
  } else {
    const txt = { finished:"✓ Last sound done", stopped:"■ Stopped", error:"✕ Last sound failed" }[dev.status];
    main.textContent = txt || "Idle";
  }
  meta.textContent = dev.lastReboot ? "Last restart: " + dev.lastReboot : "";
}

// ---------- list ----------
function makeRow(it, whenText, chipClass, chipText) {
  const row = document.createElement("div"); row.className = "item";
  const l = document.createElement("div");
  const w = document.createElement("div"); w.className = "when"; w.textContent = whenText;
  const s = document.createElement("div"); s.className = "what"; s.textContent = nameOf(it) + "  ·  vol " + it.vol;
  l.append(w, s);
  const r = document.createElement("div"); r.className = "row"; r.style.alignItems = "center";
  const c = document.createElement("span"); c.className = "chip " + chipClass; c.textContent = chipText;
  const del = document.createElement("button"); del.className = "ghost"; del.textContent = "✕"; del.title = "Remove";
  del.onclick = () => { items = items.filter(x => x.id !== it.id); publish(); render(); };
  r.append(c, del);
  row.append(l, r);
  return row;
}
function addHeading(box, text) {
  const h = document.createElement("div"); h.className = "sub"; h.textContent = text; box.appendChild(h);
}

function render() {
  const connected = !!(client && client.connected);
  $("f-add").disabled    = !(connected && loaded);
  $("f-addnow").disabled = $("f-add").disabled;
  $("q-stop").disabled   = !connected;
  $("q-all").disabled    = !(connected && loaded && items.length);

  const b = $("b-dev");
  if (dev.online === null) { b.textContent = "device: unknown"; b.className = "badge"; }
  else if (dev.online) { b.textContent = "device: online" + (dev.status ? " · " + dev.status : ""); b.className = "badge on"; }
  else { b.textContent = "device: offline"; b.className = "badge off"; }
  b.title = dev.lastReboot ? "Last restart: " + dev.lastReboot : "";

  renderNowLine();

  const box = $("q-list"); box.innerHTML = "";
  if (!items.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = loaded ? "Nothing scheduled or queued." : "Waiting for queue…";
    box.appendChild(e); return;
  }
  const nowS = Date.now() / 1000;

  // Scheduled items, by time
  const sched = items.filter(it => !it.q).sort((a,b) => a.at - b.at);
  if (sched.length) {
    addHeading(box, "Scheduled");
    sched.forEach(it => {
      const res = resultChip(it);
      let cls, txt;
      if (res)               [cls, txt] = res;
      else if (it.at < nowS) { cls = "late";  txt = "waiting on device"; }
      else                   { cls = "sched"; txt = "scheduled"; }
      box.appendChild(makeRow(it, new Date(it.at*1000).toLocaleString(), cls, txt));
    });
  }

  // Queued items, in the order added
  const queue = items.filter(it => it.q).sort((a,b) => a.at - b.at);
  if (queue.length) {
    addHeading(box, "Queue (plays in order)");
    let pos = 0;
    queue.forEach(it => {
      const res = resultChip(it);
      let cls, txt;
      if (res) [cls, txt] = res;
      else     { pos++; cls = "sched"; txt = pos === 1 ? "up next" : "#" + pos + " in line"; }
      box.appendChild(makeRow(it, "Queued " + timeText(it.at), cls, txt));
    });
  }
}

// ---------- wire up ----------
$("f-vol").oninput    = e => { $("vol-out").textContent = e.target.value; };
$("f-mode").onchange  = updateMode;
$("f-now").onclick    = () => setNow(0);
$("f-add").onclick    = () => addItem();                               // schedule or queue, per mode
$("f-addnow").onclick = () => addItem(Math.floor(Date.now() / 1000));  // scheduled for right now
$("c-go").onclick     = connect;
$("q-stop").onclick   = sendStop;
$("q-all").onclick    = clearQueue;
// Remove everything that has finished (done, failed, stopped or skipped) - keeps what's playing or waiting
$("q-clear").onclick  = () => {
  items = items.filter(x => !(done[x.id] && done[x.id].r !== R_PLAYING) || isPlaying(x));
  publish(); render();
};

$("c-host").value = load("host") || "n16a90c6.ala.us-east-1.emqxsl.com"; $("c-user").value = load("user"); $("c-pass").value = load("pass");
setNow(5); updateMode(); render();
if ($("c-host").value && $("c-user").value) { $("conn-card").open = false; connect(); }
setInterval(render, 30000);
</script>
</body>
</html>
