<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Scheduler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1, h2 {
            margin-top: 0;
        }
        .status-bar {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .status-disconnected {
            color: #dc3545;
            font-weight: bold;
        }
        .connection-box {
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            background-color: #f1f3f5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        .inline-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-danger { background-color: #dc3545; color: white; padding: 5px 10px; font-size: 12px;}
        .queue-section {
            margin-top: 30px;
            border-top: 2px solid #dee2e6;
            padding-top: 20px;
        }
        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .playlist-reference {
            margin-top: 15px;
            font-size: 13px;
            color: #6c757d;
            background: #fff3cd;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sound Scheduler</h1>
    
    <!-- Status Connection Bar -->
    <div class="status-bar">
        <div>broker: <span class="status-disconnected">disconnected</span></div>
        <div>device: <span>unknown</span></div>
    </div>

    <!-- Connection Info (Saved in Browser Context Only) -->
    <div class="connection-box">
        <label>Connection (saved in this browser only)</label>
        <div class="inline-inputs">
            <input type="text" placeholder="EMQX host" id="mqttHost">
            <input type="text" placeholder="Username" id="mqttUser">
            <input type="password" placeholder="Password" id="mqttPass">
        </div>
        <button class="btn-primary" onclick="alert('Connecting functionality goes here...')">Connect</button>
    </div>

    <!-- New Request Controls -->
    <h2>New request</h2>
    
    <div class="form-group">
        <label for="actionType">Function</label>
        <select id="actionType">
            <option value="Play sound">Play sound</option>
            <option value="Play folder (series)">Play folder (series)</option>
        </select>
    </div>

    <!-- Numeric Input replacement field -->
    <div class="form-group">
        <label for="soundSelect">Sound / folder (Type File Number)</label>
        <input type="number" id="soundSelect" min="1" placeholder="Enter file track number (e.g., 1)">
        
        <!-- Quick visible guide helper for user mapping -->
        <div class="playlist-reference">
            <strong>Track Reference Guide:</strong> 1: Alarm, 2: Chime, 3: Warning Siren, 4: Announcement
        </div>
    </div>

    <div class="form-group">
        <label for="volumeRange">Volume: <span id="volumeVal">20</span> / 30</label>
        <input type="range" id="volumeRange" min="0" max="30" value="20" oninput="document.getElementById('volumeVal').textContent = this.value">
    </div>

    <div class="form-group">
        <label for="scheduleTime">Schedule time</label>
        <input type="text" id="scheduleTime" value="Now">
    </div>

    <div class="btn-row">
        <button class="btn-primary" onclick="addToQueue()">Add to queue</button>
    </div>

    <!-- Queue Output Area -->
    <div class="queue-section">
        <h2>Queue</h2>
        <div id="queueContainer">
            <!-- Scheduled items go here -->
        </div>
        <div style="margin-top: 15px;">
            <button class="btn-secondary" onclick="clearPlayed()">Remove played</button>
        </div>
    </div>
</div>

<script>
    // Demo internal array mapping numbers to real source files
    const availableFiles = [
        "alarm_system_alert.mp3",
        "doorbell_chime.wav",
        "industrial_warning_siren.mp3",
        "voice_announcement.mp3"
    ];

    // Auto-cap the typed number configuration bound to asset array length
    document.getElementById('soundSelect').max = availableFiles.length;

    const queueList = [];

    function addToQueue() {
        const actionType = document.getElementById('actionType').value;
        const soundInput = document.getElementById('soundSelect').value;
        const volume = document.getElementById('volumeRange').value;
        const time = document.getElementById('scheduleTime').value;

        const fileIndex = parseInt(soundInput) - 1;

        // Input validation handler
        if (isNaN(fileIndex) || fileIndex < 0 || fileIndex >= availableFiles.length) {
            alert("Invalid Selection! Please enter a valid number track between 1 and " + availableFiles.length);
            return;
        }

        const selectedFileName = availableFiles[fileIndex];

        // Store transaction object configurations
        const queueItem = {
            id: Date.now(),
            function: actionType,
            file: `[Track ${soundInput}] ${selectedFileName}`,
            volume: volume,
            time: time,
            status: 'Pending'
        };

        queueList.push(queueItem);
        renderQueue();
    }

    function renderQueue() {
        const container = document.getElementById('queueContainer');
        container.innerHTML = '';

        if (queueList.length === 0) {
            container.innerHTML = '<p style="color: #888; font-style: italic;">No items currently in queue</p>';
            return;
        }

        queueList.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'queue-item';
            div.innerHTML = `
                <div>
                    <strong>${item.function}</strong> - ${item.file}<br>
                    <small>Volume: ${item.volume}/30 | Time: ${item.time}</small>
                </div>
                <button class="btn-danger" onclick="removeItem(${index})">Delete</button>
            `;
            container.appendChild(div);
        });
    }

    function removeItem(index) {
        queueList.splice(index, 1);
        renderQueue();
    }

    function clearPlayed() {
        // Simple demo clean clear wrapper 
        alert("Played elements removed successfully.");
    }

    // Initialize list empty UI state 
    renderQueue();
</script>

</body>
</html>
